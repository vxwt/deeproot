<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEEPROOT - a monster-spare RPG</title>
<style>html,body{margin:0;height:100%;background:#000}body{display:flex;align-items:center;justify-content:center}canvas{width:100%;max-width:640px;max-height:100vh;aspect-ratio:4/3;background:#000}</style>
</head><body><canvas id="c" width="640" height="480"></canvas>
<script>
const X=document.getElementById('c').getContext('2d'),K={},P={};
onkeydown=e=>{if(!K[e.key])P[e.key]=1;K[e.key]=1;if(e.key.startsWith('Arrow'))e.preventDefault()};
onkeyup=e=>K[e.key]=0;
const ok=()=>P.z||P.Z||P.Enter,no=()=>P.x||P.X||P.Shift,rnd=(a,b)=>a+Math.random()*(b-a);
const M=["####################","#..................#","#.gggg.....H..ggg..#","#.gggg........ggg..#","#.gggg...S....ggg..#","#..................#","#......Q...........#","#..................#","#.ggg.........gggg.#","#.ggg.........gggg.#","#..................#","#..................#","#........B.........#","#..................#","####################"];
const IT={Pie:12,Stew:25},SHOP=[['Pie',10],['Stew',25],['Branch (+5 ATK)',60]];
let G={hp:20,mhp:20,lv:1,exp:0,gold:10,atk:0,items:['Pie','Pie'],x:288,y:224,q:0,k0:0,kills:0,boss:0,steps:0},fresh=1;
let SV=JSON.stringify(G);
try{let s=localStorage.getItem('deeproot');if(s){SV=s;G=JSON.parse(s);fresh=0}}catch(e){}
let mode='world',T=null,B=null,f=[0,1],cur=0;
/* ---------- text + drawing helpers ---------- */
function say(l,cb){T={l,i:0,c:0,cb}}
function tu(){let s=T.l[T.i];T.c=Math.min(s.length,T.c+.7);if(ok()){if(T.c<s.length)T.c=s.length;else{T.i++;T.c=0;if(T.i>=T.l.length){let g=T.cb;T=null;g&&g()}}}}
function dt(x,y,s,z,col){z=z||20;X.fillStyle=col||'#fff';X.font='bold '+z+'px monospace';String(s).split('\n').forEach((l,i)=>X.fillText(l,x,y+i*z*1.3))}
function box(x,y,w,h){X.fillStyle='#000';X.fillRect(x,y,w,h);X.strokeStyle='#fff';X.lineWidth=4;X.strokeRect(x,y,w,h)}
function list(a,x,y,sel){a.forEach((s,i)=>{dt(x+24,y+i*28,s);if(i==sel)dt(x-2,y+i*28,'♥',20,'#f00')})}
/* ---------- enemies ---------- */
const EN={
mold:{n:'Moldling',hp:30,atk:3,g:8,xp:6,need:2,pat:'rain',intro:'* Moldling oozes into view.',
 flav:['* Moldling jiggles.','* Smells like old cheese.','* Moldling drips on the floor.'],
 acts:[['Check',0,['* MOLDLING  ATK 3  DEF 0\n* A fuzzy blob. Hates being alone.']],['Compliment',1,['* You praise its spores.\n* It blushes green.']],['Hum',1,['* You hum a tune.\n* Moldling sways along.']]],
 d:()=>{X.fillStyle='#6c3';X.beginPath();X.arc(0,40,50,Math.PI,0);X.fill();X.fillRect(-50,40,100,20);X.fillStyle='#000';X.fillRect(-20,20,10,14);X.fillRect(10,20,10,14)}},
moth:{n:'Glimmoth',hp:24,atk:4,g:10,xp:8,need:2,pat:'side',intro:'* Glimmoth flutters in, glowing.',
 flav:['* Glimmoth circles the light.','* Dust glitters in the air.','* Glimmoth flaps nervously.'],
 acts:[['Check',0,['* GLIMMOTH  ATK 4  DEF 1\n* Drawn to anything shiny.']],['Shine',1,['* You reflect light at it.\n* Glimmoth is mesmerized.']],['Stay still',1,['* You stand calmly.\n* It lands on your head.']]],
 d:()=>{X.fillStyle='#fc6';X.beginPath();X.moveTo(0,40);X.lineTo(-70,0);X.lineTo(-50,70);X.fill();X.beginPath();X.moveTo(0,40);X.lineTo(70,0);X.lineTo(50,70);X.fill();X.fillStyle='#963';X.fillRect(-8,20,16,50)}},
boss:{n:'Warden Thornwick',hp:240,atk:4,g:200,xp:60,need:7,boss:1,intro:'* The way out is blocked by Thornwick.',
 flav:['* Thorns rattle in the dark.','* Thornwick studies you.','* The air smells like pine.','* Thornwick sighs, leaves falling.'],
 ph:[['* Warden Thornwick: "Halt, little sprout!"'],['* Thornwick: "Impressive roots...\n  but the gate stays shut!"'],['* Thornwick: "I am tired of guarding.\n  ...Still. I will not yield!"']],
 acts:[['Check',0,['* WARDEN THORNWICK  ATK 4  DEF 5\n* Lonely guardian. Seems tired.']],['Talk',1,['* You ask about the gate.\n* Thornwick grumbles.','* You ask how long he has guarded.\n* "...Ages."','* You say the gate is just a door.\n* Thornwick looks away.']],['Listen',1,['* You listen. He mutters about\n  the moss that grows on him.','* He misses the sun.']],['Taunt',-1,['* You jeer at him.\n* His thorns bristle.']]],
 d:()=>{X.fillStyle='#4a2';X.beginPath();X.arc(0,20,60,0,7);X.fill();X.fillStyle='#531';X.fillRect(-25,60,50,60);X.fillStyle='#fd0';X.fillRect(-25,10,14,12);X.fillRect(11,10,14,12);X.fillStyle='#8c4';for(let i=-3;i<=3;i++){X.beginPath();X.moveTo(i*16-6,-30);X.lineTo(i*16,-60);X.lineTo(i*16+6,-30);X.fill()}}}};
/* ---------- battle ---------- */
function bt(k,intro){let e=EN[k];mode='battle';B={e,hp:e.hp,mood:0,turn:0,ph:'wait',sel:0,c:0,px:50,d:0,tm:0,b:[],sx:320,sy:365,inv:0,bx:0,by:0,bw:640,bh:480,msg:e.intro,lp:-1,len:0};say(intro||[e.intro],()=>B.ph='menu')}
const phase=()=>B.e.boss?(B.hp>B.e.hp*.66?0:B.hp>B.e.hp*.33?1:2):0;
function et(){let b=B,e=b.e,p=phase(),go=()=>{b.ph='dodge';b.tm=0;b.b=[];b.sx=320;b.sy=365;b.inv=0;b.len=e.boss?480+p*70:300};
 if(e.boss&&p!=b.lp){b.lp=p;b.ph='wait';say(e.ph[p],go)}else go()}
function bl(x,y,vx,vy){B.b.push({x,y,vx,vy})}
function spawn(){let t=B.tm,e=B.e,p=phase(),a=e.boss?[['rain'],['rain','side'],['aim','spiral','rain']][p]:[e.pat];
 a.forEach(k=>{
  if(k=='rain'&&t%(e.boss?12:16)==0)bl(rnd(230,410),255,rnd(-.4,.4),2.4+p*.3);
  if(k=='side'&&t%22==0){let l=Math.random()<.5;bl(l?222:418,rnd(260,380),l?2.6:-2.6,0)}
  if(k=='aim'&&t%45==0){let an=Math.atan2(B.sy-255,B.sx-320+rnd(-30,30));bl(320,255,Math.cos(an)*3,Math.sin(an)*3)}
  if(k=='spiral'&&t%7==0){let an=t*.35;bl(320,290,Math.cos(an)*1.8,Math.sin(an)*1.8)}})}
function win(kill){let e=B.e,ls=[],xp=kill?e.xp:0;G.gold+=e.g;G.exp+=xp;G.kills++;
 ls.push(kill?'* YOU WON!\n* You earned '+xp+' EXP and '+e.g+' gold.':'* You spared '+e.n+'.\n* You earned '+e.g+' gold.');
 while(G.exp>=G.lv*10){G.lv++;G.mhp+=4;ls.push('* Your LOVE increased.\n* Max HP up to '+G.mhp+'!')}
 if(e.boss){G.boss=kill?2:1;ls.push(kill?'* The gate crumbles. You escape...\n* but at what cost? (Try sparing.)':'* Thornwick opens the gate.\n* Sunlight spills in. PACIFIST ENDING.\n* Thanks for playing!')}
 B.ph='wait';B.e.d0=1;say(ls,()=>{B=null;mode='world'})}
function die(){B.ph='wait';say(['* You cannot give up just yet...','* (Returning to your last SAVE.)'],()=>{G=JSON.parse(SV);B=null;mode='world'})}
function ub(){let b=B,tg=b.ph=='dodge'?[220,250,200,140]:[30,250,580,140];
 b.bx+=(tg[0]-b.bx)*.3;b.by+=(tg[1]-b.by)*.3;b.bw+=(tg[2]-b.bw)*.3;b.bh+=(tg[3]-b.bh)*.3;
 if(T){tu();return}
 let ph=b.ph,dx=(P.ArrowRight?1:0)-(P.ArrowLeft?1:0),dy=(P.ArrowDown?1:0)-(P.ArrowUp?1:0),e=b.e;
 if(ph=='menu'){b.sel=(b.sel+dx+4)%4;if(ok()){b.c=0;
  if(b.sel==0){b.ph='fight';b.px=50}else if(b.sel==1)b.ph='act';
  else if(b.sel==2){if(!G.items.length)say(['* You have no items.']);else b.ph='item'}else b.ph='mercy'}}
 else if(ph=='fight'){b.px+=7;if(ok()||b.px>590){let acc=Math.max(0,1-Math.abs(b.px-320)/270),d=b.px>=590?0:Math.round((6+G.lv*2+G.atk)*(.3+acc*1.4));b.d=d;b.hp-=d;b.ph='hit';b.tm=0}}
 else if(ph=='hit'){b.tm++;if(b.tm>50){b.hp<=0?win(1):et()}}
 else if(ph=='act'||ph=='item'||ph=='mercy'){let n=ph=='act'?e.acts.length:ph=='item'?G.items.length:(e.boss?1:2);b.c=(b.c+dy+n)%n;
  if(no())b.ph='menu';else if(ok()){
   if(ph=='act'){let a=e.acts[b.c];b.mood=Math.max(0,b.mood+a[1]);b.ph='wait';say([a[2][b.turn%a[2].length]],et)}
   else if(ph=='item'){let nm=G.items.splice(b.c,1)[0],h=IT[nm];G.hp=Math.min(G.mhp,G.hp+h);b.ph='wait';say(['* You ate the '+nm+'.\n* Recovered '+h+' HP!'],et)}
   else if(b.c==0){if(b.mood>=e.need)win(0);else{b.ph='wait';say(['* '+e.n+' is not ready to be spared.'],et)}}
   else{b.ph='wait';if(Math.random()<.7)say(['* You escaped...'],()=>{B=null;mode='world'});else say(["* Couldn't escape!"],et)}}}
 else if(ph=='dodge'){b.sx=Math.max(228,Math.min(412,b.sx+((K.ArrowRight?1:0)-(K.ArrowLeft?1:0))*2.6));b.sy=Math.max(258,Math.min(382,b.sy+((K.ArrowDown?1:0)-(K.ArrowUp?1:0))*2.6));
  spawn();b.tm++;if(b.inv>0)b.inv--;
  b.b.forEach(o=>{o.x+=o.vx;o.y+=o.vy;if(!b.inv&&Math.hypot(o.x-b.sx,o.y-b.sy)<10&&G.hp>0){G.hp-=e.atk+(e.boss?phase():0);b.inv=50;if(G.hp<=0){G.hp=0;die()}}});
  b.b=b.b.filter(o=>o.x>200&&o.x<440&&o.y>235&&o.y<410);
  if(b.tm>b.len&&G.hp>0){b.ph='menu';b.b=[];b.turn++;b.msg=b.mood>=e.need?'* '+e.n+' seems ready to be spared.':e.flav[b.turn%e.flav.length]}}}
function drawB(){let b=B,e=b.e;X.fillStyle='#000';X.fillRect(0,0,640,480);
 if(!e.d0){X.save();X.translate(320+(b.ph=='hit'&&b.tm<30?Math.sin(b.tm)*8:0),90);e.d();X.restore()}
 if(b.ph=='hit'){X.fillStyle='#600';X.fillRect(220,12,200,12);X.fillStyle='#0f0';X.fillRect(220,12,200*Math.max(0,b.hp)/e.hp,12);dt(300,60,b.d?String(b.d):'MISS',26,'#f33')}
 box(b.bx,b.by,b.bw,b.bh);
 if(T)dt(52,290,T.l[T.i].slice(0,T.c|0));
 else if(b.ph=='menu')dt(52,290,b.msg);
 else if(b.ph=='fight'){X.strokeStyle='#fff';X.lineWidth=3;X.strokeRect(50,310,540,40);X.fillStyle='#fa0';X.fillRect(318,312,4,36);X.fillStyle='#fff';X.fillRect(b.px,306,8,48)}
 else if(b.ph=='act')list(e.acts.map(a=>a[0]),60,295,b.c);
 else if(b.ph=='item')list(G.items,60,295,b.c);
 else if(b.ph=='mercy')list(e.boss?['Spare']:['Spare','Flee'],60,295,b.c);
 else if(b.ph=='dodge'){b.b.forEach(o=>{X.fillStyle='#fff';X.beginPath();X.arc(o.x,o.y,5,0,7);X.fill()});if(!(b.inv>0&&b.tm%6<3))dt(b.sx-9,b.sy+7,'♥',22,'#f00')}
 dt(30,415,'YOU  LV '+G.lv+'   HP',18);X.fillStyle='#c00';X.fillRect(230,401,60,16);X.fillStyle='#ff0';X.fillRect(230,401,60*G.hp/G.mhp,16);dt(300,415,G.hp+' / '+G.mhp,18);
 ['FIGHT','ACT','ITEM','MERCY'].forEach((s,i)=>{let x=30+i*150;X.strokeStyle=b.ph=='menu'&&b.sel==i?'#ff0':'#f80';X.lineWidth=3;X.strokeRect(x,432,120,38);dt(x+12,458,s,18,X.strokeStyle);if(b.ph=='menu'&&b.sel==i)dt(x+4,457,'',1)});
 if(b.ph=='menu')dt(30+b.sel*150-2,458,'♥',16,'#f00')}
/* ---------- overworld ---------- */
const sd=(x,y)=>{let c=(M[y>>5]||'#')[x>>5]||'#';return '#HSQ'.includes(c)||(c=='B'&&!G.boss)};
function mv(dx,dy){let nx=G.x+dx,ny=G.y+dy;for(let [a,b] of [[0,0],[19,0],[0,19],[19,19]])if(sd(nx+a,ny+b))return;G.x=nx;G.y=ny}
function uw(){if(T){tu();return}
 if(P.c||P.C){mode='inv';cur=0;return}
 let dx=(K.ArrowRight?1:0)-(K.ArrowLeft?1:0),dy=(K.ArrowDown?1:0)-(K.ArrowUp?1:0);
 if(dx||dy){f=dx?[dx,0]:[0,dy];mv(dx*2,0);mv(0,dy*2);
  if(M[(G.y+10)>>5][(G.x+10)>>5]=='g'&&++G.steps>220+Math.random()*200){G.steps=0;bt(Math.random()<.5?'mold':'moth')}}
 if(ok()){let ch=(M[(G.y+10+f[1]*22)>>5]||'')[(G.x+10+f[0]*22)>>5];
  if(ch=='S'){G.hp=G.mhp;SV=JSON.stringify(G);try{localStorage.setItem('deeproot',SV)}catch(e){}say(['* The glittering star fills you\n  with determination.','* (HP restored. Game saved.)'])}
  else if(ch=='H'){mode='shop';cur=0;say(['* Mossy Merchant: "Fresh heals!\n  Gold only, friend."'])}
  else if(ch=='Q'){if(G.q==0)say(['* Old Sprout: "The grass is crawling\n  with monsters, traveler."','* "Beat or befriend 3 of them\n  and I will pay you."'],()=>{G.q=1;G.k0=G.kills});
   else if(G.q==1){if(G.kills-G.k0>=3){G.q=2;G.gold+=60;say(['* Old Sprout: "You did it!"','* (Quest complete! +60 gold)'])}else say(['* "Monsters beaten or spared: '+(G.kills-G.k0)+'/3.\n  Keep at it."'])}
   else say(['* "The Warden guards the exit south.\n  Buy heals and SAVE first."'])}
  else if(ch=='B'&&!G.boss)bt('boss',['* The way out is blocked by Thornwick.','* Warden Thornwick: "Halt, little sprout!"'])}}
function us(){if(T){tu();return}
 cur=(cur+((P.ArrowDown?1:0)-(P.ArrowUp?1:0))+3)%3;if(no()){mode='world';return}
 if(ok()){let s=SHOP[cur];if(G.gold<s[1])say(['* "Not enough gold."']);
  else if(cur==2){if(G.atk)say(['* "You already hold a Branch."']);else{G.gold-=60;G.atk=5;say(['* Equipped the Branch! ATK up.'])}}
  else if(G.items.length>=8)say(['* "Your pockets are full."']);
  else{G.gold-=s[1];G.items.push(s[0]);say(['* Bought '+s[0]+'.'])}}}
function ui(){if(T){tu();return}
 let n=Math.max(1,G.items.length);cur=(cur+((P.ArrowDown?1:0)-(P.ArrowUp?1:0))+n)%n;if(no()||P.c||P.C){mode='world';return}
 if(ok()&&G.items.length){let nm=G.items.splice(cur,1)[0];G.hp=Math.min(G.mhp,G.hp+IT[nm]);cur=0;say(['* You ate the '+nm+'. HP '+G.hp+'/'+G.mhp+'.'])}}
function drawW(){
 for(let r=0;r<15;r++)for(let c=0;c<20;c++){let ch=M[r][c],x=c*32,y=r*32;
  X.fillStyle=ch=='#'?'#4a3a6a':ch=='g'?'#2f6b3a':'#2a2140';X.fillRect(x,y,32,32);
  if(ch=='g'){X.fillStyle='#4a9a55';X.fillRect(x+6,y+8,3,10);X.fillRect(x+20,y+14,3,10)}
  if(ch=='S')dt(x+2,y+27,'★',30,'#ff0');
  if(ch=='H'){X.fillStyle='#c63';X.fillRect(x+4,y+4,24,28);X.fillStyle='#fff';X.fillRect(x+9,y+10,4,4);X.fillRect(x+19,y+10,4,4)}
  if(ch=='Q'){X.fillStyle='#39c';X.fillRect(x+6,y+6,20,26);X.fillStyle='#fff';X.fillRect(x+10,y+12,4,4);X.fillRect(x+18,y+12,4,4)}
  if(ch=='B'&&!G.boss){X.fillStyle='#4a2';X.fillRect(x-8,y-24,48,56);X.fillStyle='#fd0';X.fillRect(x+4,y-10,6,6);X.fillRect(x+22,y-10,6,6)}}
 X.fillStyle='#e44';X.fillRect(G.x,G.y,20,20);X.fillStyle='#fc9';X.fillRect(G.x+4,G.y+2,12,8);
 dt(8,20,'LV '+G.lv+'  HP '+G.hp+'/'+G.mhp+'  G '+G.gold+'   [Z] talk  [C] items',14)}
/* ---------- main loop ---------- */
if(fresh)say(['* You fell into the Deeproot Cavern.','* Arrows: move  Z: confirm  X: cancel\n  C: items & status','* Walk in the grass to meet monsters.\n  Spare them or fight them.','* SAVE at the star. The Warden\n  guards the exit south.']);
function loop(){
 if(mode=='world')uw();else if(mode=='battle')ub();else if(mode=='shop')us();else if(mode=='inv')ui();
 if(mode=='battle')drawB();else{drawW();
  if(mode=='shop'){box(40,40,560,170);list(SHOP.map(s=>s[0]+'  '+s[1]+'G'),70,80,cur);dt(70,190,'Gold: '+G.gold+'   [X] leave',16)}
  if(mode=='inv'){box(40,40,560,250);dt(70,75,'LV '+G.lv+'  HP '+G.hp+'/'+G.mhp+'  ATK '+(10+G.atk)+'  EXP '+G.exp+'/'+G.lv*10+'  Gold '+G.gold,16);
   dt(70,100,'Quest: '+(['none','Beat/spare 3 monsters ('+Math.min(3,G.kills-G.k0)+'/3)','done'][G.q]),16);
   G.items.length?list(G.items,70,140,cur):dt(70,140,'(no items)',18);dt(70,275,'[Z] eat  [X] close',14)}
  if(T){box(30,330,580,130);dt(52,368,T.l[T.i].slice(0,T.c|0))}}
 if(mode=='battle'&&0){} for(let k in P)delete P[k];requestAnimationFrame(loop)}
loop();
</script></body></html>
